[project]
name = "tool-judge"
version = "0.1.0"
description = "A permission layer that knows what your project is: scoped grants, deterministic rails, advisory goal-fit."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
tool-judge = "tool_judge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tool_judge"]
